name: SHAHI RAJE Permanent Release APK

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11'

      - name: Extract Android Source
        run: |
          unzip -q SHAHI_RAJE_FINAL_CONSOLIDATED_BUILD_53_BUILD56.zip
          test -d SHAHI_RAJE_ANDROID_READY_SOURCE

      - name: Verify Build 56 Source
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: |
          grep -n "versionCode\\|versionName" app/build.gradle
          grep -q "WebViewAssetLoader" app/src/main/java/com/shahiraje/business/MainActivity.java
          grep -q "appassets.androidplatform.net/assets/index.html" app/src/main/java/com/shahiraje/business/MainActivity.java
          grep -q "androidx.webkit:webkit:1.14.0" app/build.gradle
          echo "BUILD 56 SOURCE CHECK PASSED"

      - name: Set Build 56 Version
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/build.gradle")
          text = p.read_text()
          text = re.sub(r'versionCode\\s+\\d+', 'versionCode 56', text, count=1)
          text = re.sub(r'versionName\\s+["\\\'][^"\\\']*["\\\']', 'versionName "56.0"', text, count=1)
          p.write_text(text)
          PY
          grep -n "versionCode\\|versionName" app/build.gradle

      - name: Build Release APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: |
          gradle clean assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Locate Android Build Tools
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          test -d "$BUILD_TOOLS"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

      - name: Restore Permanent Signing Keystore
        run: |
          mkdir -p signing
          echo "${{ secrets.SHAHI_RAJE_KEYSTORE_BASE64 }}" | base64 --decode > signing/shahi-raje-release.jks
          test -s signing/shahi-raje-release.jks

      - name: Align Release APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: |
          "$BUILD_TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          test -f app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign Release APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SHAHI_RAJE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHAHI_RAJE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHAHI_RAJE_KEY_PASSWORD }}
        run: |
          "$BUILD_TOOLS/apksigner" sign \
            --ks ../signing/shahi-raje-release.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out app/build/outputs/apk/release/SHAHI-RAJE-BUILD-56-RELEASE.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          test -f app/build/outputs/apk/release/SHAHI-RAJE-BUILD-56-RELEASE.apk

      - name: Verify Permanent Signed APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: |
          APK="app/build/outputs/apk/release/SHAHI-RAJE-BUILD-56-RELEASE.apk"
          echo "===== APK FILE SHA-256 ====="
          sha256sum "$APK"
          echo "===== APK SIGNATURE VERIFICATION ====="
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          echo "===== BUILD 56 PERMANENT APK VERIFICATION PASSED ====="

      - name: Upload Permanent Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAHI-RAJE-BUILD-56-PERMANENT-RELEASE-VERIFIED
          path: SHAHI_RAJE_ANDROID_READY_SOURCE/app/build/outputs/apk/release/SHAHI-RAJE-BUILD-56-RELEASE.apk
          if-no-files-found: error
