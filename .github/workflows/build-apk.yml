name: SHAHI RAJE APK Verification

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11'

      - name: Extract Project
        run: |
          unzip -q SHAHI_RAJE_FINAL_CONSOLIDATED_BUILD_53.zip
          test -d SHAHI_RAJE_ANDROID_READY_SOURCE

      - name: Build APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          echo "===== APK SHA-256 ====="
          sha256sum "$APK"

          echo "===== APK SIGNATURE ====="
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload Verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAHI-RAJE-APK-VERIFIED
          path: SHAHI_RAJE_ANDROID_READY_SOURCE/app/build/outputs/apk/debug/app-debug.apk
