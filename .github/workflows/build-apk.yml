- name: Verify APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          echo "APK SHA-256:"
          sha256sum "$APK"

          echo "APK signature verification:"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAHI-RAJE-APK-VERIFIED
          path: SHAHI_RAJE_ANDROID_READY_SOURCE/app/build/outputs/apk/debug/app-debug.apk
