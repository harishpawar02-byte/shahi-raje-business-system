name: SHAHI RAJE Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Extract project
        run: |
          unzip -q SHAHI_RAJE_FINAL_CONSOLIDATED_BUILD_53.zip
          find . -maxdepth 3 -type f | head -100

      - name: Build APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAHI-RAJE-APK
          path: SHAHI_RAJE_ANDROID_READY_SOURCE/app/build/outputs/apk/debug/app-debug.apk
