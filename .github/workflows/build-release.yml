name: SHAHI RAJE Release APK

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11'

      - name: Extract current Android source
        run: |
          unzip -q SHAHI_RAJE_FINAL_CONSOLIDATED_BUILD_53.zip
          test -d SHAHI_RAJE_ANDROID_READY_SOURCE

      - name: Prepare Build 54 release
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace("versionCode 53", "versionCode 54")
          s = s.replace("versionName '53.0'", "versionName '54.0'")
          if 'release {' not in s:
              raise SystemExit('release buildType missing')
          s = s.replace('release {\n', 'release {\n            minifyEnabled false\n            shrinkResources false\n            debuggable false\n', 1)
          p.write_text(s)
          readme = Path('app/src/main/assets/README.md')
          if readme.exists():
              readme.write_text(readme.read_text().replace('This package is an installable PWA build, not an Android APK.', 'This package contains the Android application source for SHAHI RAJE BUSINESS MANAGEMENT SYSTEM.'))
          PY
          grep -nE 'versionCode|versionName|minifyEnabled|debuggable' app/build.gradle

      - name: Build release APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: gradle assembleRelease --stacktrace

      - name: Generate ephemeral CI signing key
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 24)"
          echo "KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -v \
            -keystore ci-release.jks \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias shahi-raje-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=SHAHI RAJE CI, OU=Build, O=SHAHI RAJE, L=India, ST=Maharashtra, C=IN"

      - name: Align and sign APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          zipalign -f 4 app/build/outputs/apk/release/app-release.apk app-release-aligned.apk
          "$APKSIGNER" sign \
            --ks ci-release.jks \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:KEYSTORE_PASS \
            --out SHAHI-RAJE-BUILD-54-release.apk \
            app-release-aligned.apk

      - name: Verify signed APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -f SHAHI-RAJE-BUILD-54-release.apk
          "$APKSIGNER" verify --verbose --print-certs SHAHI-RAJE-BUILD-54-release.apk
          echo "===== SHA-256 ====="
          sha256sum SHAHI-RAJE-BUILD-54-release.apk
          echo "===== APK DETAILS ====="
          "$ANDROID_HOME/platform-tools/aapt2" dump badging SHAHI-RAJE-BUILD-54-release.apk | head -5 || true

      - name: Upload verified release APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAHI-RAJE-BUILD-54-RELEASE-VERIFIED
          path: SHAHI_RAJE_ANDROID_READY_SOURCE/SHAHI-RAJE-BUILD-54-release.apk
          if-no-files-found: error
