name: SHAHI RAJE Release APK

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11'

      - name: Extract Android Source
        run: |
          unzip -q SHAHI_RAJE_FINAL_CONSOLIDATED_BUILD_53.zip
          test -d SHAHI_RAJE_ANDROID_READY_SOURCE

      - name: Set Build 54 Version
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          text = p.read_text()

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode 54',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+["\'][^"\']*["\']',
              'versionName "54.0"',
              text,
              count=1
          )

          p.write_text(text)
          print("Build 54 version configured")
          PY

          grep -n "versionCode\|versionName" app/build.gradle

      - name: Build Release APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: |
          gradle clean assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Locate Android Build Tools
        id: tools
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          test -d "$BUILD_TOOLS"

          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          echo "Using build tools: $BUILD_TOOLS"

          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

      - name: Generate CI Signing Key
        run: |
          mkdir -p signing

          keytool -genkeypair \
            -v \
            -keystore signing/shahi-raje-ci.jks \
            -storepass changeit \
            -keypass changeit \
            -alias shahi-raje-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SHAHI RAJE, OU=CI, O=SHAHI RAJE, L=India, ST=Maharashtra, C=IN"

          test -f signing/shahi-raje-ci.jks

      - name: Align Release APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: |
          mkdir -p app/build/outputs/apk/release

          "$BUILD_TOOLS/zipalign" \
            -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

          test -f app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign Release APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: |
          "$BUILD_TOOLS/apksigner" sign \
            --ks ../signing/shahi-raje-ci.jks \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --ks-key-alias shahi-raje-ci \
            --out app/build/outputs/apk/release/SHAHI-RAJE-BUILD-54-RELEASE.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

          test -f app/build/outputs/apk/release/SHAHI-RAJE-BUILD-54-RELEASE.apk

      - name: Verify Signed APK
        working-directory: SHAHI_RAJE_ANDROID_READY_SOURCE
        run: |
          APK="app/build/outputs/apk/release/SHAHI-RAJE-BUILD-54-RELEASE.apk"

          echo "===== APK SHA-256 ====="
          sha256sum "$APK"

          echo "===== APK SIGNATURE VERIFICATION ====="
          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "===== APK VERIFICATION PASSED ====="

      - name: Upload Verified Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAHI-RAJE-BUILD-54-RELEASE-VERIFIED
          path: SHAHI_RAJE_ANDROID_READY_SOURCE/app/build/outputs/apk/release/SHAHI-RAJE-BUILD-54-RELEASE.apk
          if-no-files-found: error
